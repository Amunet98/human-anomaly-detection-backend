# The database is deliberately NOT declared here. Render's free Postgres
# expires 30 days after creation (14-day grace, then the data is deleted),
# and a workspace may only hold one, so a managed free DB is a treadmill.
# Postgres is hosted on Neon's free plan instead - it doesn't expire -
# and DATABASE_URL is set manually on the service.
services:
  - type: web
    name: human-anomaly-detection-backend
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && node prisma/seed.js
    startCommand: npm start
    envVars:
      # Neon direct (unpooled) connection string, ?sslmode=require only.
      - key: DATABASE_URL
        sync: false
      - key: CLASS_NAMES
        value: "fall,sit,stand"
      - key: DETECTION_CONFIDENCE
        value: "0.4"
      - key: PRODUCER_TOKEN
        sync: false
